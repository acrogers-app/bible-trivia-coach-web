// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // This repo lives on an exFAT volume, where macOS materializes file
    // metadata as AppleDouble (._*) files mid-build and Android resource
    // parsing fails on them ("._drawable is not a directory"). Build
    // outputs must land on a native APFS filesystem instead.
    layout.buildDirectory = new File(
        System.getProperty('user.home'),
        '.gradle-builds/bible-trivia-coach/' + project.path.replace(':', '_')
    )
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
